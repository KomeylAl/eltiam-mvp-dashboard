services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator

    command: npx prisma migrate deploy

    environment:
      DATABASE_URL: ${DATABASE_URL}

    networks:
      - infrastructure

    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner

    depends_on:
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

    ports:
      - "127.0.0.1:8001:8001"

    environment:
      NODE_ENV: production
      PORT: 8001
      HOSTNAME: 0.0.0.0

      DATABASE_URL: ${DATABASE_URL}

    networks:
      - infrastructure

networks:
  infrastructure:
    external: true
