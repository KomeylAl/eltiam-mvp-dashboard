services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner

    restart: unless-stopped

    ports:
      - "127.0.0.1:8001:8001"

    environment:
      NODE_ENV: production
      PORT: 8001
      HOSTNAME: 0.0.0.0

      DATABASE_URL: ${DATABASE_URL}

    networks:
      - infrastructure

networks:
  infrastructure:
    external: true
